services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wagering
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wagering"]
      interval: 2s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:4.7.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
